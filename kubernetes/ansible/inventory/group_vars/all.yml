---
# Global variables for Kubernetes cluster

# Cluster configuration
cluster_name: "k3s-cluster"
cluster_domain: "localdomain"

# Network settings
kube_network_plugin: "cilium"
pod_cidr: "10.244.0.0/16"
service_cidr: "10.96.0.0/12"

# Security settings
enable_ssh_key_auth: true

# Container runtime
container_runtime: "containerd"

# K3s settings
k3s_version: "latest"
k3s_token: "secret-token"

# Load Balancer settings
# Replace these with actual IP addresses for your environment
load_balancer_vip: "192.168.1.160"       # Virtual IP (VIP) for the load balancer
load_balancer_vip_prefix: "24"           # CIDR prefix for the VIP
keepalived_router_id: 51
keepalived_password: "k3scluster"

# HAProxy settings
haproxy_maxconn: 4096
haproxy_timeout_connect: 5000
haproxy_timeout_client: 50000
haproxy_timeout_server: 50000

# Control plane node IPs for HAProxy backend
cp_node_1_ip: "192.168.1.150"
cp_node_2_ip: "192.168.1.151"
cp_node_3_ip: "192.168.1.152"

# Node networking (used by common role to ensure correct static IP)
# Per-host expected IP is taken from ansible_host in inventory
# Override these per host in inventory if needed (e.g., k3s-cp-1 node_gateway=192.168.1.1)
node_gateway: "192.168.1.1"
node_netmask_prefix: "24"
node_dns: "8.8.8.8 8.8.4.4"
