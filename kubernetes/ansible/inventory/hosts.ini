# Ansible inventory for Kubernetes HA Cluster

[all:vars]
ansible_user=ubuntu
ansible_become=yes
ansible_become_method=sudo

# Control Plane Nodes
# Replace {CP_NODE_X_IP} with actual IP addresses
[control_plane]
k3s-cp-1 ansible_host={CP_NODE_1_IP}
k3s-cp-2 ansible_host={CP_NODE_2_IP}
k3s-cp-3 ansible_host={CP_NODE_3_IP}

# Worker Nodes
# Replace {WORKER_NODE_IP} with actual IP address
[worker]
k3s-worker-1 ansible_host={WORKER_NODE_IP}

# Load Balancer Nodes
# Replace {LB_NODE_IP} with actual IP address
[load_balancer]
k3s-lb-1 ansible_host={LB_NODE_IP}

# All nodes
[all:children]
control_plane
worker
load_balancer

# Kubernetes cluster group
[k8s_cluster:children]
control_plane
worker