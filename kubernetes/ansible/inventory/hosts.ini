# Ansible inventory for Kubernetes HA Cluster

[all:vars]
ansible_user=ubuntu
ansible_become=yes
ansible_become_method=sudo

# Control Plane Nodes
# Replace {CP_NODE_X_IP} with actual IP addresses
[control_plane]
k3s-cp-1 ansible_host=192.168.1.150
k3s-cp-2 ansible_host=192.168.1.151
k3s-cp-3 ansible_host=192.168.1.152

# Worker Nodes
# Replace {WORKER_NODE_IP} with actual IP address
[worker]
k3s-worker-1 ansible_host=192.168.1.155

# Load Balancer Nodes
# Replace {LB_NODE_IP} with actual IP address
[load_balancer]
k3s-lb-1 ansible_host=192.168.1.160

