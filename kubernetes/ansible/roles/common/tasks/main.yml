---
# Fix: Previous broken runs may have left malformed docker source files on the remote host.
# Remove BOTH old-style (docker.list) and new-style (docker.sources) to prevent conflicts.
- name: Remove malformed docker source files from previous broken runs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker.sources
  ignore_errors: yes

- name: Update package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - curl
      - gnupg2
      - software-properties-common
      - ca-certificates
      - apt-transport-https
    state: present

# Fix: The deb822_repository module requires 'name', 'uris', 'suites', and 'components'.
# Previously had two broken tasks: first was missing uris/suites/components, second used
# legacy 'repo' string format which doesn't work with this module (missing 'name' arg).
# Using Docker's official method: curl + gpg --dearmor ensures the key is in the correct
# binary format that signed-by expects (get_url alone may not produce a valid keyring).
- name: Add Docker GPG key (official method)
  ansible.builtin.shell:
    cmd: >
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg |
      gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
    creates: /usr/share/keyrings/docker-archive-keyring.gpg

- name: Add Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: [stable]
    signed_by: /usr/share/keyrings/docker-archive-keyring.gpg
    state: present

- name: Install containerd
  apt:
    name: containerd
    state: present

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory

# Fix: The 'command' module does NOT invoke a shell, so '>' redirection is treated as a
# literal argument to containerd — the file never gets created. Use 'shell' module instead
# so the shell interprets the redirect properly.
- name: Generate containerd config
  ansible.builtin.shell: "containerd config default > /etc/containerd/config.toml"
  args:
    creates: /etc/containerd/config.toml

- name: Configure containerd to use systemd cgroup driver
  lineinfile:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    line: 'SystemdCgroup = true'

- name: Restart containerd service
  systemd:
    name: containerd
    state: restarted
    enabled: yes

- name: Create modules-load.d directory
  file:
    path: /etc/modules-load.d
    state: directory

- name: Enable required kernel modules
  copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf

- name: Load kernel modules immediately
  command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter

- name: Configure sysctl settings for Kubernetes networking
  copy:
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      vm.swappiness=0
    dest: /etc/sysctl.d/k8s.conf

- name: Apply sysctl settings
  command: "sysctl --system"

- name: Create systemd system.conf.d directory
  file:
    path: /etc/systemd/system.conf.d
    state: directory

- name: Configure systemd cgroup accounting
  copy:
    content: |
      [Manager]
      DefaultCPUAccounting=yes
      DefaultIOAccounting=yes
      DefaultMemoryAccounting=yes
    dest: /etc/systemd/system.conf.d/10-cgroups.conf

- name: Reload systemd configuration
  systemd:
    daemon_reload: yes