---
# Phase 0: Ensure correct static IP is configured on the VM
# -----------------------------------------------------------
# These tasks verify the VM has the expected static IP (from ansible_host).
# If not (e.g., cloud-init failed on cloned Proxmox VMs, or VM picked up a
# DHCP IP), they deploy a netplan config with the expected static IP and apply
# it without dropping the SSH connection.
#
# Key design decisions:
#   - Uses netplan (not ifupdown) because Ubuntu 24.04 uses systemd-networkd.
#   - Never runs `ifdown` — that would kill the Ansible SSH connection.
#   - Disables cloud-init network management so it doesn't reapply on reboot.
#   - Netplan file is 99- prefixed to sort AFTER cloud-init's 50- config.

- name: Detect the active network interface dynamically
  ansible.builtin.shell:
    cmd: >
      ip -o link show |
      awk '/state UP/ && !/lo/ {print $2; exit}' |
      tr -d ':'
  register: iface_detect
  changed_when: false
  failed_when: false

- name: Set detected interface fact
  ansible.builtin.set_fact:
    node_interface: "{{ iface_detect.stdout | default('eth0') }}"

- name: Display detected interface
  ansible.builtin.debug:
    msg: "Detected network interface: {{ node_interface }}"

- name: Record the expected static IP for this node
  ansible.builtin.set_fact:
    expected_ip: "{{ ansible_host }}"

- name: Check current IPv4 address on the detected interface
  ansible.builtin.shell:
    cmd: >
      ip -4 addr show {{ node_interface }} | grep -oP 'inet \K[\d.]+' | head -1
  register: ip_check
  changed_when: false
  failed_when: false

- name: Record current IP (empty string if no IP assigned)
  ansible.builtin.set_fact:
    current_ip: "{{ ip_check.stdout | default('') }}"

- name: Display IP comparison
  ansible.builtin.debug:
    msg:
      - "Expected IP (from inventory): {{ expected_ip }}"
      - "Detected interface: {{ node_interface }}"
      - "Current IP (from ip a): {{ current_ip | default('(no IP assigned)') }}"

- name: Fix IP if not assigned or does not match the expected static IP
  when:
    - current_ip == '' or current_ip != expected_ip
  block:
    - name: Disable cloud-init network management (prevent reapply on reboot)
      ansible.builtin.copy:
        content: |
          network:
            config: disabled
        dest: /etc/cloud/cloud.cfg.d/99-disable-network.cfg
        owner: root
        group: root
        mode: '0644'

    - name: Deploy netplan config with static IP
      ansible.builtin.copy:
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              {{ node_interface }}:
                addresses:
                  - {{ expected_ip }}/{{ node_netmask_prefix }}
                routes:
                  - to: default
                    via: {{ node_gateway }}
                nameservers:
                  addresses:
                    {% for ns in node_dns.split() %}
                    - {{ ns }}
                    {% endfor %}
        dest: /etc/netplan/99-static-ip.yaml
        owner: root
        group: root
        mode: '0644'

    - name: Remove any cloud-init-generated netplan configs (50-cloud-init-*.yaml)
      ansible.builtin.shell:
        cmd: rm -f /etc/netplan/50-cloud-init-*.yaml
      changed_when: false

    - name: Apply netplan config (does NOT drop SSH connection)
      ansible.builtin.command: netplan apply
      register: netplan_result
      changed_when: true

    - name: Verify new IP is now assigned
      ansible.builtin.shell:
        cmd: >
          ip -4 addr show {{ node_interface }} | grep -oP 'inet \K[\d.]+' | head -1
      register: verify_ip
      changed_when: false

    - name: Fail if IP still not assigned after netplan apply
      ansible.builtin.fail:
        msg: >-
          IP assignment failed on {{ inventory_hostname }}.
          Expected {{ expected_ip }} but interface {{ node_interface }} has
          {{ verify_ip.stdout | default('NO IP') }}.
      when: verify_ip.stdout | default('') != expected_ip

    - name: Confirm IP assignment
      ansible.builtin.debug:
        msg: "IP {{ expected_ip }} confirmed on {{ node_interface }} ({{ inventory_hostname }})."

  rescue:
    - name: IP fix failed — print diagnostic info
      ansible.builtin.debug:
        msg:
          - "IP fix failed for {{ inventory_hostname }}"
          - "Expected IP: {{ expected_ip }}"
          - "Detected interface: {{ node_interface }}"
          - "Check if the VM is reachable and netplan/networkd is installed."

- name: Remove malformed docker source files from previous broken runs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker.sources
  ignore_errors: yes

- name: Update package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - curl
      - gnupg2
      - software-properties-common
      - ca-certificates
      - apt-transport-https
    state: present

# Fix: The deb822_repository module requires 'name', 'uris', 'suites', and 'components'.
# Previously had two broken tasks: first was missing uris/suites/components, second used
# legacy 'repo' string format which doesn't work with this module (missing 'name' arg).
# Using Docker's official method: curl + gpg --dearmor ensures the key is in the correct
# binary format that signed-by expects (get_url alone may not produce a valid keyring).
- name: Add Docker GPG key (official method)
  ansible.builtin.shell:
    cmd: >
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg |
      gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
    creates: /usr/share/keyrings/docker-archive-keyring.gpg

- name: Add Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: [stable]
    signed_by: /usr/share/keyrings/docker-archive-keyring.gpg
    state: present

- name: Install containerd
  apt:
    name: containerd
    state: present

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory

# Fix: The 'command' module does NOT invoke a shell, so '>' redirection is treated as a
# literal argument to containerd — the file never gets created. Use 'shell' module instead
# so the shell interprets the redirect properly.
- name: Generate containerd config
  ansible.builtin.shell: "containerd config default > /etc/containerd/config.toml"
  args:
    creates: /etc/containerd/config.toml

- name: Configure containerd to use systemd cgroup driver
  lineinfile:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    line: 'SystemdCgroup = true'

- name: Restart containerd service
  systemd:
    name: containerd
    state: restarted
    enabled: yes

- name: Create modules-load.d directory
  file:
    path: /etc/modules-load.d
    state: directory

- name: Enable required kernel modules
  copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf

- name: Load kernel modules immediately
  command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter

- name: Configure sysctl settings for Kubernetes networking
  copy:
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      vm.swappiness=0
    dest: /etc/sysctl.d/k8s.conf

- name: Apply sysctl settings
  command: "sysctl --system"

- name: Create systemd system.conf.d directory
  file:
    path: /etc/systemd/system.conf.d
    state: directory

- name: Configure systemd cgroup accounting
  copy:
    content: |
      [Manager]
      DefaultCPUAccounting=yes
      DefaultIOAccounting=yes
      DefaultMemoryAccounting=yes
    dest: /etc/systemd/system.conf.d/10-cgroups.conf

- name: Reload systemd configuration
  systemd:
    daemon_reload: yes

# Phase: Reboot check and health verification
# -----------------------------------------------------------
# Some system changes (kernel modules, sysctl, cgroup config) may require
# a reboot to take full effect. If /var/run/reboot-required exists, reboot
# the node, wait for it to come back, and verify system health.

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Display reboot requirement
  ansible.builtin.debug:
    msg: "Reboot required: {{ reboot_required.stat.exists | default(false) }}"

- name: Reboot node if required
  when: reboot_required.stat.exists
  block:
    - name: Flush handlers before reboot
      ansible.builtin.meta: flush_handlers

    - name: Reboot the node
      ansible.builtin.reboot:
        reboot_timeout: 180
        pre_reboot_delay: 10
        post_reboot_delay: 30
        connect_timeout: 60

    - name: Wait for node to be reachable after reboot
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 180

    - name: Gather fresh facts after reboot
      ansible.builtin.setup:

    - name: Print system health status
      ansible.builtin.debug:
        msg:
          - "=== System Health: {{ inventory_hostname }} ({{ ansible_host }}) ==="
          - "Hostname: {{ ansible_hostname }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Uptime: {{ ansible_uptime_seconds | default('N/A') }} seconds"
          - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "CPU cores: {{ ansible_processor_cores }}"
          - "Memory total: {{ (ansible_memtotal_mb | default(0)) | int }} MB"
          - "Memory free: {{ (ansible_memfree_mb | default(0)) | int }} MB"
          - "Disk root total: {{ ansible_devices | default({}) | length }} devices"
          - "Default interface: {{ ansible_default_ipv4.interface | default('N/A') }}"
          - "IP address: {{ ansible_default_ipv4.address | default('N/A') }}"
          - "Reboot required file: {{ reboot_required.stat.exists | default(false) }} (should be false after reboot)"

  rescue:
    - name: Reboot or health check failed
      ansible.builtin.fail:
        msg: >-
          Failed to reboot or verify health on {{ inventory_hostname }}
          ({{ ansible_host }}). Check console for details.

- name: Print system health status (no reboot needed)
  when: not reboot_required.stat.exists
  ansible.builtin.debug:
    msg:
      - "=== System Health: {{ inventory_hostname }} ({{ ansible_host }}) ==="
      - "Hostname: {{ ansible_hostname }}"
      - "Kernel: {{ ansible_kernel }}"
      - "Uptime: {{ ansible_uptime_seconds | default('N/A') }} seconds"
      - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"
      - "CPU cores: {{ ansible_processor_cores }}"
      - "Memory total: {{ (ansible_memtotal_mb | default(0)) | int }} MB"
      - "Memory free: {{ (ansible_memfree_mb | default(0)) | int }} MB"
      - "Default interface: {{ ansible_default_ipv4.interface | default('N/A') }}"
      - "IP address: {{ ansible_default_ipv4.address | default('N/A') }}"