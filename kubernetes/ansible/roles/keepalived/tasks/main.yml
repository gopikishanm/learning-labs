---
# Tasks for Keepalived installation and configuration

- name: Install Keepalived
  apt:
    name: keepalived
    state: present
    update_cache: yes

- name: Create Keepalived configuration directory
  file:
    path: /etc/keepalived
    state: directory

- name: Backup default Keepalived configuration
  copy:
    src: /etc/keepalived/keepalived.conf
    dest: /etc/keepalived/keepalived.conf.bak
    remote_src: yes
    force: no

- name: Deploy Keepalived configuration
  template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart keepalived

- name: Enable Keepalived service
  systemd:
    name: keepalived
    enabled: yes
    state: started
  notify: restart keepalived