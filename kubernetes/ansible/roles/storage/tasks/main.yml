---
# Tasks for Storage solution deployment (OpenEBS)

- name: Install Helm
  shell: |
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Add OpenEBS Helm repository
  command: "helm repo add openebs https://openebs.github.io/charts"
  args:
    creates: "{{ ansible_env.HOME }}/.cache/helm/repository/openebs-index.yaml"
  register: helm_repo_add
  changed_when: '"already exists" not in helm_repo_add.stdout'

- name: Update Helm repositories
  command: "helm repo update"

- name: Install OpenEBS via Helm
  shell: |
    helm install openebs openebs/openebs \
      --namespace openebs \
      --create-namespace \
      --set localprovisioner.storagePath=/var/openebs/local
  args:
    creates: /etc/rancher/k3s/storage/openebs
  register: openebs_install
  # If already installed, this will fail gracefully

- name: Create OpenEBS StorageClass
  shell: |
    cat <<EOF | kubectl apply -f -
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: openebs-local
    provisioner: local.csi.openebs.io
    volumeBindingMode: WaitForFirstConsumer
    EOF
  register: sc_result
  changed_when: '"created" in sc_result.stdout'

- name: Display storage setup info
  debug:
    msg: "OpenEBS deployed. StorageClass 'openebs-local' created."