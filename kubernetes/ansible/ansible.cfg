[defaults]
host_key_checking = False
inventory = inventory/hosts.ini
# Fix: group_vars/ must live inside the inventory directory (inventory/group_vars/)
# because Ansible resolves group_vars relative to the inventory location, not the
# ansible.cfg location. Previously group_vars/ was at the ansible root level and
# variables like k3s_token were never loaded, causing "undefined" errors.
remote_user = ubuntu
become = True
become_method = sudo
timeout = 30
gathering = smart
fact_caching = memory
stdout_callback = default
callback_whitelist = profile_tasks
callback_result_format = yaml
roles_path = ./roles:./roles # This is added to ensure that Ansible can find roles in the current directory and the roles directory.

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-%%r-%%h-%%p
retries = 3