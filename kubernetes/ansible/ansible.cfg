[defaults]
host_key_checking = False
inventory = inventory/hosts.ini
remote_user = ubuntu
become = True
become_method = sudo
timeout = 30
gathering = smart
fact_caching = memory
stdout_callback = yaml
callback_whitelist = profile_tasks

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-%%r-%%h-%%p
retries = 3