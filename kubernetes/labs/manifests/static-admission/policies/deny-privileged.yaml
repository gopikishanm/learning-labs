# deny-privileged.static.k8s.io — Phase 3 C3
#
# A ValidatingAdmissionPolicy loaded from disk (not from the API). It denies
# privileged containers in all namespaces except kube-system.
#
# KEY RULES for manifest-based admission:
#   - object names MUST end with `.static.k8s.io`
#   - spec.paramKind / spec.paramRef are NOT allowed (no API references)
#   - the binding's policyName must reference a policy in the same manifest set
#
# This file lives in the staticManifestsDir configured in
# admission-configuration.yaml (/etc/kubernetes/admission/policies/).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "example-deny-privileged.static.k8s.io"
  annotations:
    kubernetes.io/description: "Deny privileged containers outside kube-system"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        !variables.allContainers.exists(c,
        has(c.securityContext) && has(c.securityContext.privileged) &&
        c.securityContext.privileged == true)
      message: "Privileged containers are not allowed"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: "example-deny-privileged-binding.static.k8s.io"
  annotations:
    kubernetes.io/description: "Bind deny-privileged policy to all namespaces except kube-system"
spec:
  policyName: "example-deny-privileged.static.k8s.io"
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: "kubernetes.io/metadata.name"
          operator: NotIn
          values: ["kube-system"]
